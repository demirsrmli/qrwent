name: Build and test qrwent
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-and-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install and build web sources
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run test:protocol
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Check committed HTML matches the sources
        run: git diff --exit-code -- web/qrwent-PC.html
      - name: Download pinned host test dependencies
        run: |
          mkdir -p .deps
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/com/google/zxing/core/3.5.3/core-3.5.3.jar --output .deps/zxing.jar
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar --output .deps/json.jar
      - name: Java protocol tests with browser interoperability
        run: python3 tests/run_java.py --zxing .deps/zxing.jar --json .deps/json.jar --browser
      - uses: actions/upload-artifact@v4
        with:
          name: qrwent-desktop
          path: web/qrwent-PC.html
          if-no-files-found: error
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: qrwent-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
